# À placer dans le dépôt GitHub sous .github/workflows/docker.yml (voir deploy/COSMOS.md, étape 2).
# Construit l'image Docker et la publie sur GitHub Container Registry à chaque mise à jour de main.
name: Image Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mairie-de-meru/planning-ecole-numerique:latest
            ghcr.io/mairie-de-meru/planning-ecole-numerique:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
